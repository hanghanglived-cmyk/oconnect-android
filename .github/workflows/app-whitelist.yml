name: App whitelist debug APK
on:
  push:
    branches: [feature/app-whitelist, "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitelist-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Import unchanged hash-verified native engine (all ABIs)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/pengyue-polaron/oconnect-android/releases/download/v1.17.0/oconnect-v1.17.0-debug.apk -o "$RUNNER_TEMP/upstream.apk"
          python3 scripts/import-release-native.py "$RUNNER_TEMP/upstream.apk" | tee native-build.log
      - name: Unit tests, lint and standalone debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee gradle-build.log
      - name: Verify installable output and native payload
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libopenconnect.so libstoken.so libcurl-bin.so libcsd-wrapper.so; do
              unzip -l "$apk" "lib/$abi/$lib" | grep -F "lib/$abi/$lib"
            done
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -F "package: name='io.github.hanghanglived.oconnect.whitelist.diagnostic'" apk-badging.txt
          sha256sum "$apk" > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oconnect-whitelist-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            apk-badging.txt
      - name: Save diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            native-build.log
            gradle-build.log
            app/build/reports/
